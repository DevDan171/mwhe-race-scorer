name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Require a semantic version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web bundles
        run: pnpm --filter @mwhe/laptop --filter @mwhe/station build

      - name: Pack web bundles
        run: |
          mkdir -p release
          tar -C apps/laptop -czf "release/mwhe-laptop-web-${GITHUB_REF_NAME}.tar.gz" dist
          tar -C apps/station -czf "release/mwhe-station-web-${GITHUB_REF_NAME}.tar.gz" dist

      - name: Record what this release contains
        run: |
          mkdir -p release
          cat > release/NATIVE_BUILDS.txt << EOF
          MWHE Race Scorer ${GITHUB_REF_NAME}

          Attached:
          - The Windows installer (NSIS, per-user). Download MWHE-Race-Scorer_<version>_x64-setup.exe.
          - The Android station APK. mwhe-station-<version>.apk when the release keystore
            secrets are set, otherwise mwhe-station-<version>-debug.apk. Sideload it.
            There is no Play Store build.
          - Vite web bundles for the laptop and the station, for development.

          The installer is unsigned unless the Azure Artifact Signing secrets are set.
          In-app updates are published only when the Tauri updater key secrets are set
          and plugins.updater.pubkey in tauri.conf.json is the matching public key.
          latest.json still points at the Windows installer only.
          See docs/RELEASING.md and docs/install-windows.md.

          Versioning: the git tag is the release version (vMAJOR.MINOR.PATCH).
          schemaVersion in @mwhe/core is independent and bumps on a breaking
          document change. See docs/release.md.
          EOF

      - name: Upload web bundles
        uses: actions/upload-artifact@v4
        with:
          name: mwhe-web-bundles
          path: release/*

  windows:
    uses: ./.github/workflows/laptop-windows.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/station-android.yml
    secrets: inherit

  publish:
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Gather release files
        run: |
          mkdir -p dist-release
          find release-assets -type f -exec cp -t dist-release {} +
          ls -la dist-release
          test -n "$(find dist-release -name '*-setup.exe' -print -quit)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist-release/*
          body: |
            ## MWHE Race Scorer ${{ github.ref_name }}

            Download the Windows installer (`MWHE-Race-Scorer_<version>_x64-setup.exe`). It installs for the current Windows user, adds a Start menu shortcut and a desktop shortcut, and does not need an administrator password.

            Windows will warn that the app is unrecognized while it is unsigned. On the blue window, choose **More info**, then **Run anyway**. The steps are in [docs/install-windows.md](https://github.com/DevDan171/mwhe-race-scorer/blob/${{ github.ref_name }}/docs/install-windows.md).

            Installing over an older copy keeps the races. Uninstall keeps them too, unless you check **Delete the application data**.

            The checkpoint phone APK is attached as `mwhe-station-<version>.apk` when the Android signing secrets are set, or `mwhe-station-<version>-debug.apk` when they are not. Sideload it. There is no Play Store listing. Details are in `NATIVE_BUILDS.txt`.
            Tags use semantic versioning: `vMAJOR.MINOR.PATCH`.

      - name: Checkout the release scripts
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify the updater download URL
        run: pnpm --filter @mwhe/laptop exec tsx src/release/verify-published-update.ts
