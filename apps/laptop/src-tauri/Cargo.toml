[package]
name = "mwhe-laptop"
version = "0.2.1"
edition = "2021"
description = "MWHE race-day laptop shell."
rust-version = "1.90"

[lib]
name = "mwhe_laptop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# windows-native is required. keyring 3 has no default features, so a Windows
# build without it uses an in-memory mock: set_password returns Ok and the
# next Entry::new reads nothing. Sign-in then looks successful and the event
# list looks signed out.
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
